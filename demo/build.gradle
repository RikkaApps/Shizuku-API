plugins {
    id('com.android.application')
    id('dev.rikka.tools.refine')
}

android {
    enableKotlin = false
    namespace 'rikka.shizuku.demo'
    defaultConfig {
        applicationId "rikka.shizuku.demo"
        versionCode 1
        versionName api_version_name
        externalNativeBuild {
            ndkBuild {
                arguments += "-j${Runtime.getRuntime().availableProcessors()}"
            }
        }
    }
    externalNativeBuild {
        ndkBuild {
            path("src/main/cpp/Android.mk")
        }
    }
    buildFeatures {
        buildConfig = true
        viewBinding = true
        aidl true
    }
    buildTypes {
        release {
            vcsInfo.include = false
            signingConfig = signingConfigs["debug"]
            optimization {
                enable = true
                keepRules {
                    includeDefault = false
                }
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    packaging {
        resources {
            excludes += "**"
        }
        jniLibs {
            useLegacyPackaging true
        }
    }
    lint {
        checkReleaseBuilds = false
    }
    dependenciesInfo {
        includeInApk = false
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.3.0'

    implementation project(':api') // required by Shizuku and Sui
    implementation project(':provider') // required by Shizuku only

    compileOnly project(':demo-hidden-api-stub')
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.2' // bypass hidden api restriction
}
